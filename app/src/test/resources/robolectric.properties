# Robolectric emula el nivel 35, no el 36 al que apunta la app.
#
# Por qué: la app tiene que apuntar al 36 —Play lo exige desde agosto de 2026 y
# rechaza el AAB si no— y Robolectric no lo soporta todavía. Sin esta línea, los
# cuatro tests que necesitan un Context fallan antes de empezar, en la fase de
# configuración:
#
#     Package targetSdkVersion=36 > maxSdkVersion=35
#
# La 4.15.1 es la última publicada a día de hoy (3 de septiembre de 2026) y su
# tope sigue siendo el 35; no es cuestión de actualizar la dependencia, es que no
# existe la versión.
#
# Qué se pierde: nada de lo que estos tests comprueban. Los cuatro leen ficheros
# de `assets/`, serializan una copia de seguridad y montan el protocolo del
# salón; ninguno depende de una API que cambie entre el 35 y el 36. Lo que NO
# cubren —el comportamiento propio del 36, como la obligatoriedad de edge to
# edge— tampoco lo cubrían antes: eso se ve en un dispositivo con Android 16, y
# aquí solo hay uno con Android 13.
#
# Cuándo se quita: en cuanto salga una Robolectric que acepte el 36. Se borra
# este fichero y se vuelve a lanzar `check`; si pasa, ya está.
sdk=35
