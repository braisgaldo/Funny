#
# Catálogo de versiones de Funny.
#
# Todas las versiones están fijadas a propósito: una app de fiesta no gana nada
# con rangos dinámicos y sí pierde reproducibilidad de la build. Al subir una
# versión hay que anotarlo en el CHANGELOG.
#
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ktlint-plugin = "12.1.1"

compose-bom = "2024.12.01"
core-ktx = "1.15.0"
appcompat = "1.7.0"
browser = "1.8.0"
lifecycle = "2.8.7"
activity-compose = "1.9.3"
datastore = "1.1.1"
documentfile = "1.0.1"

# Nearby Connections: capa gratuita de Google Play Services que negocia sola
# Bluetooth, BLE y Wi-Fi Direct. Ver ADR-0003.
play-services-nearby = "19.3.0"

# Generación del código QR de la donación, en local y sin red. Kotlin
# multiplataforma, así que sobrevive a la migración a KMP.
qrcode-kotlin = "4.2.0"

coroutines = "1.9.0"
junit = "4.13.2"
robolectric = "4.14.1"
androidx-test-junit = "1.2.1"
# Solo en tests: descodifica el QR que genera la app para demostrar que se lee.
zxing = "3.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# Custom Tabs: la donación se abre en el navegador del sistema, nunca en un WebView.
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

play-services-nearby = { group = "com.google.android.gms", name = "play-services-nearby", version.ref = "play-services-nearby" }
qrcode-kotlin = { group = "io.github.g0dkar", name = "qrcode-kotlin", version.ref = "qrcode-kotlin" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
