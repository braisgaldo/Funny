# Release de Funny.
#
# Se dispara al empujar un tag `vX.Y.Z`. Compila el AAB (que es lo que quiere
# Google Play) y el APK (que es lo que quiere quien lo instala a mano), y los
# sube a una GitHub Release junto con el CHANGELOG.
#
# La firma se lee de los secrets del repositorio. Si no estan configurados, el
# workflow FALLA en lugar de publicar una release sin firmar: una release sin
# firmar no se puede subir a la tienda ni instalar como actualizacion, asi que
# publicarla solo serviria para confundir.
#
# Secrets que hacen falta:
#   FUNNY_KEYSTORE_BASE64    el .jks codificado en base64
#   FUNNY_KEYSTORE_PASSWORD
#   FUNNY_KEY_ALIAS
#   FUNNY_KEY_PASSWORD
#
# Para generar el primero:  base64 -w0 funny-release.jks

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: Compilar y publicar la release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4
        with:
          # Historia completa: la version de compilacion incrusta el hash y la
          # fecha del commit, y con un clon superficial no estan.
          fetch-depth: 0

      - name: Preparar el JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar Gradle con cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Comprobar que estan los secretos de firma
        # Antes de compilar nada: fallar en el minuto uno es mejor que fallar
        # despues de veinte minutos de build.
        env:
          KEYSTORE: ${{ secrets.FUNNY_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.FUNNY_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.FUNNY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FUNNY_KEY_PASSWORD }}
        run: |
          faltan=""
          [ -z "$KEYSTORE" ] && faltan="$faltan FUNNY_KEYSTORE_BASE64"
          [ -z "$PASSWORD" ] && faltan="$faltan FUNNY_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && faltan="$faltan FUNNY_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && faltan="$faltan FUNNY_KEY_PASSWORD"
          if [ -n "$faltan" ]; then
            echo "Faltan estos secrets del repositorio:$faltan"
            echo "Ver docs/INSTALL.md, apartado «Firma de release»."
            exit 1
          fi
          echo "Los cuatro secretos estan configurados."

      - name: check completo
        # Una release no sale de un arbol que no pasa las pruebas.
        run: ./gradlew :app:check --stacktrace

      - name: Reconstruir el keystore desde el secreto
        env:
          KEYSTORE: ${{ secrets.FUNNY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/funny-release.jks"
          # Comprobacion barata de que el fichero es un keystore y no basura.
          if [ ! -s "$RUNNER_TEMP/funny-release.jks" ]; then
            echo "El keystore reconstruido esta vacio: revisa el secret."
            exit 1
          fi

      - name: Compilar el AAB y el APK firmados
        env:
          # Los nombres salen de la transformacion que hace build.gradle.kts:
          # la propiedad `funny.keystore` se busca como FUNNY_KEYSTORE.
          FUNNY_KEYSTORE: ${{ runner.temp }}/funny-release.jks
          FUNNY_KEYSTORE_PASSWORD: ${{ secrets.FUNNY_KEYSTORE_PASSWORD }}
          FUNNY_KEY_ALIAS: ${{ secrets.FUNNY_KEY_ALIAS }}
          FUNNY_KEY_PASSWORD: ${{ secrets.FUNNY_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Comprobar que los binarios estan firmados de verdad
        # El build imprime un aviso y sigue si no hay keystore, asi que hay que
        # confirmar aqui que el resultado esta firmado en lugar de fiarse.
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verificando $apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose "$apk"

      - name: Borrar el keystore del runner
        # Aunque el runner es de un solo uso, no dejamos la clave por ahi.
        if: always()
        run: rm -f "$RUNNER_TEMP/funny-release.jks"

      - name: Publicar la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Funny ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      - name: Guardar los informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-release
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.txt
