# Integracion continua de Funny.
#
# Lo que se ejecuta aqui es exactamente lo mismo que en local: `:app:check`, que
# incluye las 164 pruebas, ktlint, el lint de Android y las dos verificaciones
# propias del proyecto (que no haya libreria de facturacion y que no haya textos
# escritos a fuego). Si `check` esta en verde en local, aqui tambien.
#
# No hay emulador: las 164 pruebas corren en la JVM porque `dominio/` es Kotlin
# puro. Es lo que hace que este workflow tarde minutos y no media hora.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela la ejecucion anterior: no tiene
# sentido gastar minutos en verificar un commit que ya esta superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Compilar, probar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar el JDK 17
        uses: actions/setup-java@v4
        with:
          # AGP 8.7 pide 17. Ni 11 ni 21.
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar Gradle con cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # Solo la rama por defecto escribe en la cache, para que un PR no pueda
          # envenenar la de los demas.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: check completo
        # Incluye testDebugUnitTest, ktlintCheck, lintDebug,
        # verificarSinFacturacion y verificarTextosLiterales.
        run: ./gradlew :app:check --stacktrace

      - name: Compilar el APK de depuracion
        # Despues de check, para que un fallo de pruebas se vea antes que uno de
        # empaquetado.
        run: ./gradlew :app:assembleDebug

      - name: Dejar constancia de que no hay libreria de pagos
        # La tarea verificarSinFacturacion ya ha fallado la build si la hubiera.
        # Esto guarda el arbol de dependencias como prueba documental, que es lo
        # que pide el punto 4.4.1 de la plantilla.
        if: always()
        run: ./gradlew :app:dependencies > dependencias.txt

      - name: Guardar los informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          if-no-files-found: warn
          retention-days: 14
          path: |
            dependencias.txt
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/ktlint/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt

      - name: Guardar el APK de depuracion
        uses: actions/upload-artifact@v4
        with:
          name: funny-debug-apk
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/debug/*.apk
